<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Alex Node · Digital Universe 360</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030713;color:white;font-family:Arial,sans-serif;touch-action:none}#view{position:fixed;inset:0;overflow:hidden}#sky{position:absolute;inset:0;background-image:url(cosmos_360.jpg);background-repeat:repeat-x;background-size:auto 100%;will-change:background-position}#shade{position:absolute;inset:0;background:linear-gradient(#0006,transparent 30%,#0009);pointer-events:none}header{position:absolute;top:20px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;letter-spacing:2px;font-size:16px}.brand span{color:#ff821c}button{background:#ff821c;border:0;border-radius:12px;color:#121212;font-size:14px;font-weight:800;padding:15px 16px;cursor:pointer}#status{position:absolute;top:84px;left:20px;font-size:12px;color:#d9dce8}nav{position:absolute;bottom:70px;left:16px;right:16px;display:grid;grid-template-columns:1fr 1fr;gap:9px}nav button{background:#071020bd;border:1px solid #ff821c88;color:#fff;font-size:13px;padding:13px 7px}#card{position:absolute;left:16px;right:16px;bottom:180px;background:#07101de8;border:1px solid #ff821c;padding:20px;border-radius:15px;display:none;line-height:1.5}#card b{color:#ff912f}footer{position:absolute;bottom:23px;left:20px;right:20px;color:#b9bfd0;font-size:12px;text-align:center}</style></head><body><div id="view"><div id="sky"></div><div id="shade"></div></div><header><div class="brand">A<span>—</span>N &nbsp; ALEX NODE</div><button id="motion">ENABLE 360°</button></header><div id="status">Drag to explore the universe</div><div id="card"></div><nav><button data-title="WEB DESIGN" data-text="Modern websites designed for real businesses.">🌐 WEB DESIGN</button><button data-title="ANITA" data-text="Virtual assistants for your website.">🤖 ANITA</button><button data-title="ANALYTIX" data-text="Understand your website visitors and improve performance.">📊 ANALYTIX</button><button data-title="S.P.A.C.E." data-text="Digital tools and experiences by Alex Node.">🚀 S.P.A.C.E.</button></nav><footer>Lightweight image panorama · Touch / gyroscope</footer><script>const sky=document.querySelector('#sky'),status=document.querySelector('#status'),btn=document.querySelector('#motion');let yaw=0,pitch=0,gyro=false,base=null,down=false,px=0,py=0;function render(){sky.style.backgroundPosition=(-yaw*2048/360)+'px '+(pitch*0.35)+'px'}function orient(e){if(!gyro||e.alpha==null)return;if(base===null)base=e.alpha;yaw=((e.alpha-base)+360)%360;render();status.textContent='360° sensor active'}btn.onclick=async()=>{if(gyro){gyro=false;btn.textContent='ENABLE 360°';status.textContent='Touch control';return}if(!window.isSecureContext){status.textContent='Gyroscope requires HTTPS';return}try{if(typeof DeviceOrientationEvent==='undefined')throw Error('No orientation sensor');if(typeof DeviceOrientationEvent.requestPermission==='function'){let r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw Error('Permission denied')}gyro=true;base=null;window.addEventListener('deviceorientation',orient);btn.textContent='360° ON';status.textContent='Move phone to look around. If still, use touch.'}catch(e){status.textContent='Motion unavailable: '+e.message+' — use touch'}};const view=document.querySelector('#view');view.addEventListener('pointerdown',e=>{down=true;px=e.clientX;py=e.clientY;view.setPointerCapture(e.pointerId)});view.addEventListener('pointermove',e=>{if(!down)return;let dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;if(gyro){gyro=false;btn.textContent='ENABLE 360°';status.textContent='Touch control'}yaw-=dx*.22;pitch=Math.max(-130,Math.min(130,pitch+dy*.45));render()});view.addEventListener('pointerup',()=>down=false);document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{let c=document.querySelector('#card');c.innerHTML='<b>'+b.dataset.title+'</b><br>'+b.dataset.text;c.style.display=c.style.display==='block'?'none':'block'});render();</script></body></html>
